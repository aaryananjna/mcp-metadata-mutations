name: daily-collect

# Unattended for 12 weeks. GitHub-hosted runners are free for public repos, and
# committing the snapshot back to the repo gives you a timestamped, third-party
# witnessed audit trail of exactly what the registry served on each date. That
# provenance matters more than the compute.

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC. Off the hour on purpose: everyone else
                           # schedules on :00 and you do not want to be in that
                           # thundering herd against a service with no uptime SLA.
  workflow_dispatch: {}    # lets you click "Run workflow" to test manually

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare
        run: |
          mkdir -p data reports
          # index.sqlite is gitignored, so every run starts without it.
          # Rebuild it from the committed manifests before doing anything else.
          python3 store.py data

      - name: Full snapshot
        run: python3 collect.py --data data | tee run.json

      - name: Incremental cross-check
        # Ask the API what IT thinks changed in the last 48h. Logged separately,
        # never fed to the state machine. Allowed to fail: it is a secondary
        # measurement and the full snapshot above is the primary one.
        continue-on-error: true
        run: |
          SINCE=$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          python3 collect.py --data data --since "$SINCE"

      - name: Diff against previous snapshot
        # NOT allowed to fail silently. If this breaks you want to know on day
        # two, not on week nine when you go looking for results.
        run: |
          TODAY=$(date -u +%F)
          PREV=$(python3 -c "
          from store import Store
          s = Store('data').snapshots_list()
          print(s[-2] if len(s) > 1 else '')
          ")
          if [ -n "$PREV" ]; then
            python3 diff.py silent --from "$PREV" --to "$TODAY" --data data \
              --out "reports/silent-$TODAY.json" --summary-only
          else
            echo "only one snapshot so far, nothing to diff yet"
          fi

      - name: Verify blob integrity
        run: python3 verify.py --data data --sample 500

      - name: Commit
        run: |
          git config user.name  "collector"
          git config user.email "collector@users.noreply.github.com"
          git add -A data reports run.json
          git commit -m "snapshot $(date -u +%F)" || echo "no changes"
          git push

      # A silent failure for three weeks is the only way this project dies.
      - name: Alert on failure
        if: failure()
        run: echo "::error::collector failed for $(date -u +%F)"